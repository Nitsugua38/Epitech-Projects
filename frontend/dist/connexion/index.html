<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../accueil/index.css">
<title>Jaggr - Connexion</title>
<link rel="shortcut icon" type="image/x-icon" href="../image/Job.png" />
<script src="https://kit.fontawesome.com/e401cf8907.js" crossorigin="anonymous"></script>
<script src="index.js" defer></script>
</head>
<body>

    <header>
        <div class="logo-div">
            <a href="../accueil/" class="logo"><img class="job-agregator" src="../image/Job.png" alt=""></a>
            <a href="../accueil/" class="logo"><span class="logo-text">Jaggr</span></a>
        </div>
        <div class="auth-buttons">
            <div class="icons">
                <a href="../favoris/"><i class="fa-solid fa-heart"></i></a>
                <a href="../profile/"><i class="fa-solid fa-user"></i></a>
            </div>
            <a href="../connexion/"><button class="btn-login" id="btn-login">Connexion</button></a>
            <a href="../inscription/"><button class="btn-signup" id="btn-signup">Inscription</button></a>
        </div>
    </header>

    <main class="auth-main">
        <section class="auth-hero">
            <div class="auth-copy">
                <h1>Prépare toi à swiper comme jamais.</h1>
                <p>
                    Le swipe productif.
                    <br>
                    Trouve un emploi, accède à tes favoris, tes messages et tes alertes dans une interface simple et claire.
                </p>
            </div>

            <div class="auth-card">
                <div class="auth-card-header">
                    <h2>Connexion</h2>
                    <p>Entre tes identifiants pour reprendre ta recherche d’emploi.</p>
                </div>

                <form class="auth-form">
                    <label for="email">Adresse e-mail</label>
                    <input id="email" type="email" placeholder="ex: prenom.nom@mail.com" required>

                    <label for="password">Mot de passe</label>
                    <input id="password" type="password" placeholder="Ton mot de passe" required>


                    <button type="submit" class="btn-auth-submit">Se connecter</button>
                </form>

                <p class="auth-switch">
                    Pas encore de compte ? <a href="../inscription/">Créer un compte</a>
                </p>
            </div>
        </section>
    </main>
</body>
</html>
