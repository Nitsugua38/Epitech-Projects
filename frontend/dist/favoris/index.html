<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../accueil/index.css">
<title>Jaggr - Favoris</title>
<link rel="shortcut icon" type="image/x-icon" href="../image/Job.png" />
<script src="https://kit.fontawesome.com/e401cf8907.js" crossorigin="anonymous"></script>
</head>
<body>

    <header>
        <div class="logo-div">
            <a href="../accueil/" class="logo"><img class="job-agregator" src="../image/Job.png" alt=""></a>
            <a href="../accueil/" class="logo"><span class="logo-text">Jaggr</span></a>
        </div>
        <div class="auth-buttons">
            <div class="icons">
                <a href="../favoris/"><i class="fa-solid fa-heart" style="color: #e60000;"></i></a>
                <a href="../profile/"><i class="fa-solid fa-user"></i></a>
            </div>
            <button class="btn-signup" id="btn-logout">Déconnexion</button>
        </div>
    </header>

    <main>
        <section class="hero">
            <h1>Mes favoris</h1>
            <p class="hero-subtitle">Retrouve ici toutes les offres que tu as mises de côté pour postuler plus tard.</p>
        </section>

        <section class="jobs-section">
            <div id="favorites-container" class="job-grid"></div>
        </section>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const token = localStorage.getItem("token");

            if (!token) {
                return window.location.href = "../connexion/";
            }

            const btnLogout = document.getElementById("btn-logout");
            btnLogout.addEventListener("click", (e) => {
                e.preventDefault();
                localStorage.removeItem("token");
                window.location.href = "../connexion/";
            });

            fetchFavorites(token);
        });

        function fetchFavorites(token) {
            fetch("http://localhost:3000/api/favorites", {
                headers: {
                    "Authorization": `Bearer ${token}`
                }
            })
            .then(res => {
                if (res.status === 401) return window.location.href = "../connexion/";
                return res.json();
            })
            .then(data => {
                const container = document.getElementById("favorites-container");

                if (data.favorites && data.favorites.length > 0) {
                    container.innerHTML = data.favorites.map(job => `
                        <div class="job-card" data-id="${job.offer_id}">
                            <div class="job-title">${job.title}</div>
                            <div class="job-company">${job.company}</div>
                            <div class="job-location"><i class="fa-solid fa-location-dot"></i> ${job.location}</div>
                            <button class="btn-login" onclick="removeFavorite(${job.offer_id})" style="margin-top: 15px; width: 100%; padding: 8px; border-radius: 8px;">Retirer</button>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = "<p style='text-align:center; color:#555; width: 100%;'>Tu n'as pas encore de favoris.</p>";
                }
            })
            .catch(err => console.error(err));
        }

        function removeFavorite(jobId) {
            const token = localStorage.getItem("token");
            fetch(`http://localhost:3000/api/favorites/${jobId}`, {
                method: "DELETE",
                headers: {
                    "Authorization": `Bearer ${token}`
                }
            })
            .then(res => res.json())
            .then(() => {
                fetchFavorites(token);
            })
            .catch(err => console.error(err));
        }
    </script>

</body>
</html>
