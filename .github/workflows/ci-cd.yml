name: CI and Engineering Workflow


# Runs on pull requests and pushes to main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]


jobs:

  buildAndTests:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6

      - name: Makes .env
        run: |
          echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
          echo "DB_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWORD }}" >> .env
          echo "PORT=${{ secrets.PORT }}" >> .env
          echo "API_KEY=${{ secrets.API_KEY }}" >> .env
      
      - name: Installs docker
        run: |
          mkdir -p ~/.docker/cli-plugins/
          curl -SL https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64 -o ~/.docker/cli-plugins/docker-compose
          chmod +x ~/.docker/cli-plugins/docker-compose
      
      - name: Build checks
        run: docker compose up -d --build
      
      - name: Automated tests covering at minimum two backend API routes and one data normalization function
        run: docker compose run backend npm run test

      - name: Shuts down
        run: docker compose down -v



  lint:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6

      - name: Makes .env
        run: |
          echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
          echo "DB_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWORD }}" >> .env
          echo "PORT=${{ secrets.PORT }}" >> .env
          echo "API_KEY=${{ secrets.API_KEY }}" >> .env

      - name: Sets up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "22.20.0"

      - name: Installs dependencies
        run: |
          cd backend
          npm install

      - name: Runs ESLint
        run: |
          cd backend
          npm run lint